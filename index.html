an:[["مواقف الانضباط والسلوك داخل الفصل",95],["التعامل مع ولي الأمر والزملاء والإدارة",70],["صعوبات التعلم والفروق الفردية",65],["الطوارئ والسلامة",45]],
tips:["ابدأ دائمًا بالتصرف الهادئ الذي يحفظ كرامة الطالب ويعالج السبب لا العرض.","العقاب الفوري والطرد والإحراج أمام الزملاء اختيارات خاطئة غالبًا.","الاختيار الأصح غالبًا هو الأطول والأشمل: يجمع الحوار، ثم الأخصائي أو ولي الأمر عند الحاجة."],
q:[
["أثناء الشرح لاحظت أن طالبًا يتحدث مع زميله باستمرار ويعطل سير الحصة، وقد نبّهته أكثر من مرة دون جدوى. ما التصرف الأنسب؟",["أطرده من الفصل وأسجل غيابه في السجل","أغيّر مكان جلوسه بالقرب مني وأتحدث معه على انفراد بعد الحصة لمعرفة السبب","أخصم من درجاته أمام زملائه ليكون عبرة لهم","أتجاهله حتى ينتهي الدرس حفاظًا على الوقت"],1,"تعديل البيئة والحوار الفردي يعالجان السبب ويحفظان كرامة الطالب."],
["طالب متفوق ينتهي من المهام قبل زملائه، فيشعر بالملل ويبدأ في إثارة الشغب. كيف تتصرف؟",["أطلب منه الصمت حتى ينتهي الجميع","أكلفه بأنشطة إثرائية أعمق، وأمنحه دور مساعد للمجموعات","أنقله إلى فصل آخر فورًا","أمنحه درجة النهاية العظمى وأتركه"],1,"الإثراء يلبي حاجة المتفوق ويستثمر طاقته."],
["طالب ضعيف القراءة يخجل من القراءة بصوت عالٍ أمام الفصل ويتهرب كلما طلبت منه ذلك. ما التصرف الأنسب؟",["أجبره على القراءة ليتعلم من الموقف","أستبدله بطالب آخر دائمًا","أقرأ معه في مجموعة صغيرة وأمنحه فرصًا تدريجية مع تشجيعه","أخبر زملاءه بضعف مستواه لتحفيزه"],2,"التدرج والتشجيع يبنيان ثقته بنفسه."],
["ضبطت طالبًا يغش أثناء الاختبار. ما التصرف التربوي الأنسب؟",["أمزق ورقته وأفضحه أمام الفصل","أنبهه بهدوء أثناء الاختبار ثم أتحدث معه على انفراد وأوضح له خطورة الغش وفق اللائحة","أتجاهل الأمر لأن الاختبار قصير","أطلب من زملائه مقاطعته"],1,"التنبيه الهادئ والحوار الفردي مع تطبيق اللائحة دون إهانة."],
["طالب يتأخر دائمًا عن الحصة الأولى، وعلمت أن ظروفًا أسرية صعبة تسبب ذلك. ما الأنسب؟",["أعاقبه عقابًا متدرجًا حتى ينتظم","أتحاور معه بتفهم وأتواصل مع الأخصائي الاجتماعي وولي الأمر لحل المشكلة","أمنعه من دخول الحصة","أترك الأمر للإدارة وحدها"],1,"فهم السبب والتعاون مع الأخصائي وولي الأمر."],
["حضر ولي أمر غاضب في الممر وأخذ يعترض بصوت عالٍ على درجة ابنه أمام الطلاب. كيف تتصرف؟",["أرد عليه بالنبرة نفسها دفاعًا عن نفسي","أدعوه بهدوء إلى مكان مناسب، وأشرح له معايير التقييم مدعومة بورقة ابنه","أرفض الحديث معه نهائيًا","أطلب من الأمن إخراجه فورًا"],1,"الهدوء والاحتكام إلى معايير واضحة."],
["سخر طالب من لهجة زميله أمام الفصل، وضحك بعض الطلاب. ما التصرف الأنسب؟",["أضحك معهم لأخفف التوتر","أوقف السخرية فورًا، وأناقش مع الفصل قيمة احترام الاختلاف، ثم أتحدث مع الطالب على انفراد","أعاقب الفصل كله بواجب إضافي","أنقل الطالب المسخور منه إلى فصل آخر"],1,"إيقاف السلوك وتعزيز القيم ثم المعالجة الفردية."],
["سألك طالب سؤالًا لا تعرف إجابته الدقيقة أمام زملائه. ماذا تفعل؟",["أختلق إجابة حتى لا أفقد هيبتي","أقول له إن السؤال خارج المنهج وأنهي النقاش","أعترف بأنني لا أعرف وأعده بالبحث، وأعطيه الإجابة في الحصة التالية","أوبخه على سؤاله"],2,"الأمانة العلمية تعلّم الطلاب قيمة البحث وتزيد احترامهم للمعلم."],
["الفصل مزدحم والوقت لا يكفي لإنهاء المنهج في موعده. ما الأنسب؟",["أسرع في الشرح دون اهتمام بفهم الطلاب","أخطط للدروس بتركيز على الأهداف الأساسية وأستخدم استراتيجيات تعلم نشط، وأطلب دعم الإدارة عند الحاجة","أحذف أجزاء المنهج دون إخبار أحد","أترك الطلاب يذاكرون وحدهم"],1,"التخطيط والتركيز على الأساسي مع الدعم."],
["طالب قادر لكنه يرفض أداء الواجبات باستمرار. كيف تتصرف؟",["أخصم درجاته كاملة","أبحث عن أسباب رفضه، وأربط الواجب باهتماماته، وأعزز أي تقدم يظهر منه","أكلفه بواجبات إضافية عقابًا","أتجاهل الأمر"],1,"معرفة السبب وتحفيزه داخليًا."],
["لاحظت أن طالبة تبكي في الفصل بعد خلاف مع زميلاتها. ما الأنسب؟",["أطلب منها التوقف عن البكاء فورًا","أهدئها في مكان خاص، وأستمع لها، وأحيلها للأخصائي إن لزم","أوبخ زميلاتها أمام الجميع","أتجاهل الأمر لأنه خلاف بسيط"],1,"الاستماع والخصوصية وإحالة الأخصائي."],
["انتقدك زميل أمام الطلاب في طريقة شرحك. كيف تتصرف؟",["أرد عليه بحدة أمام الطلاب","أتجاهل الموقف وأبدأ الحصة، ثم أناقش الأمر معه على انفراد بروح مهنية","أشتكيه للإدارة فورًا","أتوقف عن الشرح"],1,"الحفاظ على هيبة الموقف ثم الحوار المهني."],
["كلفتك الإدارة بنشاط إضافي في وقت يتعارض مع حصصك. ما الأنسب؟",["أرفض دون نقاش","أوافق وأهمل حصصي","أوضح ظروفي بأدب وأقترح حلًا بديلًا يحقق مصلحة العمل دون الإخلال بحصصي","أطلب من زميل أن يؤديه دون علم الإدارة"],2,"الحوار المهني وتقديم الحلول."],
["طالب يعاني من فرط الحركة ويقاطع الشرح باستمرار. ما الأنسب؟",["أربطه في مقعده","أمنحه أدوارًا حركية منظمة في الحصة وتعليمات قصيرة وواضحة","أطرده من كل حصة","أطلب من أسرته نقله فورًا"],1,"توجيه الطاقة لمهام مفيدة."],
["أخفقت نسبة كبيرة من طلاب الفصل في اختبار قصير. ما التصرف الصحيح؟",["ألوم الطلاب على الإهمال","أراجع طريقة شرحي وأعيد تدريس الأجزاء الصعبة بأسلوب مختلف","أتجاهل النتيجة وأكمل المنهج","أخفض مستوى الاختبارات دائمًا"],1,"التقويم وسيلة لتحسين التدريس."],
["تلاحظ أن طالبًا ينقل واجبه من زملائه دائمًا. كيف تتعامل؟",["أمزق الواجب وأعاقبه","أناقشه فيما يعيقه، وأكلفه بمهام فردية متدرجة تناسب مستواه","أعطيه الدرجة كاملة","أكشفه أمام الفصل"],1,"علاج سبب الاعتماد على الآخرين."],
["أصيب طالب بجرح أثناء الحصة. ما التصرف الأنسب؟",["أتركه حتى نهاية الحصة","أقدم له الإسعاف الأولي البسيط، وأبلغ الإدارة والصحة المدرسية وولي الأمر فورًا","أطلب منه الذهاب وحده للمنزل","أخفي الأمر خوفًا من المساءلة"],1,"سلامة الطالب أولًا مع إبلاغ الجهات المعنية."],
["ضرب طالب زميله ضربًا مبرحًا في الفصل. ماذا تفعل أولًا؟",["أعاقبه بالضرب","أفصل بينهما فورًا بهدوء، وأطمئن على المصاب، ثم أبلغ الأخصائي والإدارة","أنتظر نهاية الحصة","أطلب من الطلاب فضّ الشجار"],1,"الفصل الفوري ثم الإبلاغ."],
["قال لك طالب أمام زملائه: لا أحب مادتك ولا أريد حضور حصصك. ما الأنسب؟",["أعاقبه على وقاحته","أسأله بهدوء بعد الحصة عن السبب، وأحاول ربط المادة باهتماماته","أطرده","أخبر زملاءه ليسخروا منه"],1,"الحوار ومعالجة السبب."],
["طالبة موهوبة في الرسم تهمل بقية المواد. كيف تتصرف؟",["أمنعها من الرسم","أتعاون مع أسرتها لتحقيق توازن مع الاستمرار في تشجيع موهبتها","أهملها لأنها ضعيفة في المواد الأخرى","أسخر من موهبتها"],1,"تنمية الموهبة مع التوازن الدراسي."],
["فصلك يضم طلابًا متفاوتي المستوى ويصعب عليك إدارة الأنشطة. ما الأنسب؟",["أدرّس لمستوى الأعلى فقط","أنوّع الأنشطة والمجموعات بحسب المستويات وأوفر دعمًا للأضعف","أدرّس لمستوى الأضعف فقط","أطلب نقل الطلاب الضعاف"],1,"مراعاة الفروق الفردية."],
["أنت معلم جديد وترغب في بناء علاقة طيبة مع الطلاب من البداية. ما الأنسب؟",["التساهل التام معهم","الصرامة الشديدة","الاحترام المتبادل مع الحزم المتزن ووضوح القواعد","الابتعاد عنهم"],2,"الحزم المتزن مع الاحترام."],
["اتهمك طالب بالظلم في الدرجات. كيف تتصرف؟",["أهدده بخصم درجات إضافية","أراجع ورقته معه وأشرح معايير التصحيح، وأصحح الخطأ إن وجد","أرفض مناقشته","أمنحه درجات إضافية لإسكاته"],1,"الشفافية والمراجعة."],
["لاحظت على أحد الطلاب علامات إهمال وسوء معاملة في المنزل. ما الأنسب؟",["أستجوبه أمام زملائه","أبلغ الأخصائي الاجتماعي والإدارة بسرية دون استجواب الطالب","أتجاهل الأمر لأنه شأن أسري","أنشر الأمر بين المعلمين"],1,"الإبلاغ السري للجهات المختصة."],
